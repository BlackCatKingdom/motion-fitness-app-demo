name: Import staged source

on:
  workflow_dispatch:
  push:
    branches: [source-import]
    paths:
      - '.import/**'
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: source-import
          fetch-depth: 0

      - name: Decode and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .import/payload.part* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.gz
          mkdir -p /tmp/source-tree
          tar -xzf /tmp/source.tar.gz -C /tmp/source-tree
          test -f /tmp/source-tree/index.html
          test -f /tmp/source-tree/assets/app.js
          test -f /tmp/source-tree/assets/app.css

      - name: Commit clean source to main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          git rm -r --ignore-unmatch .
          cp -a /tmp/source-tree/. .
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: publish complete MOTION demo source'
          git push origin main
